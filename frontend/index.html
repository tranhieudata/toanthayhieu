<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Học Toán cùng thầy Hiếu: xây nền tảng vững vàng, luyện tập theo chủ đề và cùng bạn bè tiến bộ. Tìm lớp học phù hợp và bắt đầu hành trình học Toán của bạn." />
    <script>
      try {
        const pinnedToken = sessionStorage.getItem('toanthayhieu.auth.token');
        const signedIn = pinnedToken === null ? localStorage.getItem('token') : pinnedToken;
        const theme = signedIn && sessionStorage.getItem('toanthayhieu.theme') === 'dark' ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch { document.documentElement.dataset.theme = 'light'; }
    </script>
    <title>Toán Thầy Hiếu - Học Là Hiểu</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
